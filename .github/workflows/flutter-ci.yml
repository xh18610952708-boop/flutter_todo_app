# Flutter CI —— 推送 / PR 自动跑分析 + 测试
# 运行在 ubuntu-latest，无需 Windows C++ 工具链；
# 因此 auth_service_test（依赖 flutter 引擎）也能在此跑全。

name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: 恢复依赖
        run: flutter pub get

      - name: 静态分析
        # Flutter 3.50 将 info 级提示（如 flutter/material.dart 弃用）也视为 fatal，
        # 这里仅对 error/warning 失败，info 仍会显示但不阻断 CI。
        run: flutter analyze --no-fatal-infos

      - name: 运行单元测试
        run: flutter test
